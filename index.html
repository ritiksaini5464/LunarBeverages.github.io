<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Beverages - Coming Soon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            font-family: 'Arial', sans-serif;
            color: #fff;
            text-align: center;
        }

        .container {
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .coming-soon {
            font-size: 1.5rem;
            color: #ffd700;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
        }

        .logo {
            margin-bottom: 20px;
            display: block;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo-placeholder.png" alt="Lunar Beverages Logo" class="logo" width="150">
        <h1>Welcome to Lunar Beverages</h1>
        <p>We are crafting something out of this world! Prepare your taste buds for an extraordinary experience.</p>
        <p class="coming-soon">Coming Soon with Exciting Drinks!</p>
        <div class="footer">&copy; 2025 Lunar Beverages. All rights reserved.</div>
    </div>
</body>
</html>
